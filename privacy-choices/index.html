  <noscript><div class="noscript-card"><h1>Privacy choices for Tind 100</h1><p>Applies to version 1.18.0 (build 44), updated 6 September 2026. One explicit user action creates one local package for one selected area containing exactly zoom levels 5–11 and no others; levels 12–20 are not downloaded. You can delete one or all packages in the app. Packages are not shared and are excluded from backup. In Profile → TestFlight pilot, turn voluntary measurement off or restart pilot progress. Restarting clears consent, tasks and the Premium answer while retaining the disclosed anonymous report code and revision to prevent duplicate counting; a full app reset also deletes those. Nothing is sent automatically; you review the full JSON report and choose the recipient. Enable JavaScript for complete instructions in six languages. This site contains no analytics or tracking script.</p></div></noscript>
