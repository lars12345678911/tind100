  <noscript><div class="noscript-card" lang="en-GB"><h1>Privacy choices for Tind 100</h1><p>Applies to version 1.18.0 (build 45), updated 15 October 2026.</p>
        <p>You can withdraw location access, turn Game Center sync off or on in Profile, clear the map cache, delete downloaded OSM areas and reset local progress. Turning sync off stops new sync attempts without deleting local progress or existing cloud files.</p>
        <p>In Profile, choose Reset current progress and confirm. Local peak, route, challenge and pilot progress is reset when local saving succeeds. The reset can update the player's active v4 cloud progress through a later completed sync with a valid account binding. Disabled or blocked sync starts no new cloud updates; a request already sent may complete. Older v1/v3 files are not deleted or overwritten and block sync. Reset does not delete your Apple account, the Keychain account binding, device backups or map files.</p>
        <p>Open Profile → Map storage to clear the map cache. Open the downloadable OSM map areas list to delete an installed area and confirm its removal. This does not delete your hike history. To use the area offline again, download it again while it remains available. Deleting the app also removes its local map files.</p>
        <p>Local progress remains until you reset it or delete the app and may be included in device backups. The limited map cache may expire or be cleared in the app. OSM areas remain until you delete them in the app or delete the app. The map cache and OSM packages are excluded from iOS/iCloud device backups and are not shared or exported by the app.</p><p>These pilot controls are available only in a test environment. In Profile → TestFlight pilot, turn voluntary measurement off or restart pilot progress. Restarting clears consent, tasks and the Premium answer while retaining the disclosed anonymous report code and revision to prevent duplicate counting; a full app reset also deletes those. Nothing is sent automatically; you review the full JSON report and choose the recipient. Enable JavaScript for complete instructions in six languages. This site contains no analytics or tracking script.</p></div></noscript>
