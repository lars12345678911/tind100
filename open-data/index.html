      <h1>Åpne data for Tind 100</h1>
      <p>Versjon 1.18.0 (bygg 45), oppdatert 15. oktober 2026. Den aktive, kilde- og lisensdokumenterte katalogen inneholder 1 500 poster, nøyaktig 100 per fylke, utledet fra Kartverkets SSR, NHM/DTM og Kommuneinfo. CC BY 4.0 gjelder der kildemetadata angir dette; tjenestespesifikk rettighetsdokumentasjon må beholdes for detaljerte terrengdata. Den nye bygg45-filen er en byteidentisk kopi av den aktive katalogen. Den inneholder ikke brukerdata, kartfliser, privat korrespondanse, rå evidens, arvet turprosa eller prominensverdier.</p>
      <p>Modellhøyder og representative toppunkt for de 653 nye postene i bygg 45 er utledet fra Kartverkets NHM/DTM via WCS: 651 fra uttrekk med 10 m rutenett og to fra særskilt dokumenterte uttrekk med 1 m rutenett. Rutenettstørrelsen er ikke en garanti for nøyaktigheten. De 847 videreførte postene er ikke kontrollert på nytt gjennom disse uttrekkene. Hver post oppgir datakilder. Tind 100 har valgt, beregnet og avrundet verdiene; dette er ikke feltmålinger eller ruteanbefalinger. <a href="https://kartkatalog.geonorge.no/metadata/nasjonal-hoeydemodell-digital-terrengmodell-25833-wcs/0f0a0f38-00c4-4213-a9e5-2d861dc4abb0">NHM/DTM · Kartverket WCS</a>.</p>
      <p><a href="seed_peaks-v1.18.0-build45.json">Last ned aktiv bygg45-katalog (JSON)</a> · <a href="seed_peaks-v1.18.0-build45.json.sha256">Bygg45: SHA-256-kontrollsum</a></p>
      <p>Den separate filen fra versjon 1.17.0 (bygg 41) er bevart som et historisk katalogøyeblikksbilde. Den er ikke den aktive katalogen i bygg 45.</p>
      <p><a href="seed_peaks-v1.17.0-build41.json">Historisk bygg41-katalog (JSON)</a> · <a href="seed_peaks-v1.17.0-build41.json.sha256">Historisk bygg41: SHA-256-kontrollsum</a></p>
      <p>Ved viderebruk skal datakildene krediteres, CC BY 4.0-lisensen oppgis og Tind 100s utvelgelse, kombinasjon, beregning, avrunding og rangering beskrives. Det geografiske utvalget bruker også SSBs befolkningsrutenett for 2025 under NLOD 1.0. Behold også krediteringen «Kilde: Statistisk sentralbyrå (SSB), befolkning på 1 km-rutenett 2025», lenkene til SSB-kilden og NLOD 1.0, og opplysningen om Tind 100s bearbeiding. <a href="https://kartkatalog.geonorge.no/Metadata/uuid/25c70158-5841-4801-8bf3-fc3c5adf5329">SSB · 2025</a> · <a href="https://data.norge.no/nlod/no/1.0">NLOD 1.0</a>. Befolkningsnærhet er en luftlinjeindikator, ikke reisetid, dokumentert adkomst eller sikkerhetsvurdering. Dokumentasjonen er ikke en juridisk garanti.</p>
      <p>Aktiver JavaScript for fullstendig informasjon og kildelenker på seks språk. Nettstedet bruker ingen analyse- eller sporingsskript.</p>
