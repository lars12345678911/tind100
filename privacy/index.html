        <p class="eyebrow">Personvern · Norsk</p>
        <h1 id="privacy-nb-title">Personvern for Tind 100</h1>
        <p>Versjon 1.18 er under klargjøring og er ikke utgitt. Premium er ikke åpnet for salg. Apple håndterer eventuell betaling; appen kontrollerer kjøpsstatus og Premium-rettighet med StoreKit. Utgiveren mottar ikke kort- eller bankopplysninger gjennom kjøpsflyten. Lokal kjøpsstatus kan bevare en ventende forespørsel, men gir ikke i seg selv Premium-tilgang.</p>
        <p><strong>Sist oppdatert 6. september 2026.</strong> Gjelder Tind 100 versjon 1.18.0 (bygg 44).</p>
        <p>Tind 100 utgis av Lars Ask i Norge. Personvern- og sikkerhetshenvendelser kan sendes privat til <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Ikke send passord, engangskoder eller GPS-spor du ikke ønsker å dele.</p>
        <p>Appen har ingen annonser, markedsføringssporing eller analyseverktøy og selger ikke personopplysninger. Fremdrift lagres først på iPhonen. Når enheten allerede er innlogget i Game Center, starter appen integrasjonen automatisk og kan synkronisere en begrenset fremdriftskopi gjennom Apples tjenester; appen har ingen egen Game Center-knapp for samtykke.</p>
        <p>Når du velger posisjonsfunksjoner, kan appen behandle nøyaktig eller omtrentlig posisjon for blant annet GPS-innsjekking, kart, fylkesoppslag og ruteregistrering. Aktive GPS-spor lagres lokalt. Apple Maps/MapKit, Kartverket og ved enkelte katalogoppdateringer Overpass API mottar nødvendige tjeneste- og nettverksforespørsler. Online toporaster er begrenset til zoomnivå 11. Ved én uttrykkelig handling kan ett valgt område lastes ned som én lokal pakke for nøyaktig zoomnivå 5–11; nivå 12–20 er ikke inkludert. Deling skjer først når du selv starter den; toppkoordinater, rutespor og offlinepakken inngår ikke i delingslenken.</p>
        <p>Den frivillige TestFlight-piloten er avslått som standard. Den lagrer bare en tilfeldig rapportkode, dagavrundede oppgave- og samtykkedatoer, appkontekst, faktisk vist lokalisert Premium-pris med valuta og kilde samt valgfrie Premium-svar lokalt; ingen koordinater, rutespor, toppnavn, søk, konto- eller enhetsidentifikatorer inngår. Ingenting sendes automatisk. Du ser hele JSON-rapporten og velger selv mottaker. Omstart av pilotfremdrift beholder den opplyste anonyme rapportkoden og revisjonen for å hindre dobbelttelling; full nullstilling av appen sletter også disse. Rapporter mottatt av utgiveren slettes eller anonymiseres innen 30 dager etter endelig pilotoppsummering og senest 90 dager etter mottak, med unntak for dokumenterte sikkerhets- eller rettskrav.</p>
        <p>Du kan trekke tilbake posisjonstilgang, logge ut av Game Center i iOS, slette én eller alle lokale kartpakker og nullstille aktiv fremdrift. Offlinepakken lagres i appens lokale område, er utelukket fra sikkerhetskopi og fjernes når du sletter den i appen eller sletter appen. Det fullstendige dynamiske dokumentet inneholder lagringstider, rettslig grunnlag, mottakere, overføringer, sikkerhetskopier og alle personvernvalg på norsk, engelsk, fransk, spansk, tysk og forenklet kinesisk.</p>
      </section>
      <hr>
      <section lang="en-GB" aria-labelledby="privacy-en-title">
        <p class="eyebrow">Privacy · English</p>
        <h2 id="privacy-en-title">Privacy policy for Tind 100</h2>
        <p>Version 1.18 is being prepared and has not been released. Premium is not on sale yet. Apple handles any payment; the app checks purchase status and Premium entitlement through StoreKit. The publisher does not receive card or bank details through the purchase flow. Local purchase status may preserve a pending request but cannot itself grant Premium access.</p>
        <p><strong>Last updated 6 September 2026.</strong> Applies to Tind 100 version 1.18.0 (build 44).</p>
        <p>Tind 100 is published by Lars Ask in Norway. Send privacy and security enquiries privately to <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Do not send passwords, one-time codes or GPS tracks you do not want to share.</p>
        <p>The app has no advertising, marketing tracking or analytics tools and does not sell personal data. Progress is stored on the iPhone first. When the device is already signed in to Game Center, the app starts the integration automatically and may sync a limited progress copy through Apple’s services; there is no separate in-app Game Center consent switch.</p>
        <p>When you choose location features, the app may process precise or approximate location for features including GPS check-in, maps, county lookup and route recording. Active GPS tracks are stored locally. Apple Maps/MapKit, Kartverket and, for certain catalogue updates, Overpass API receive the service and network requests needed to provide those functions. Online topographic raster tiles are capped at zoom level 11. With one explicit action, one selected area can be downloaded as one local package for exactly zoom levels 5–11; levels 12–20 are not included. Sharing starts only when you initiate it; summit coordinates, route tracks and the offline package are not included in the shared link.</p>
        <p>The voluntary TestFlight pilot is off by default. It stores only a random report code, day-rounded task and consent dates, app context, the localised Premium price actually displayed with currency and source, and optional Premium answers locally; no coordinates, route track, peak name, search, account or device identifier is included. Nothing is sent automatically. You review the full JSON report and choose the recipient. Restarting pilot progress retains the disclosed anonymous report code and revision to prevent duplicate counting; a full app reset also deletes those. Reports received by the publisher are deleted or anonymised within 30 days after the final pilot summary and no later than 90 days after receipt, except for documented security or legal requirements.</p>
        <p>You can withdraw location access, sign out of Game Center in iOS, delete one or all local map packages and reset active progress. The offline package is kept in the app’s local storage, excluded from backup and removed when you delete it in the app or delete the app. The complete dynamic document covers retention, legal bases, recipients, transfers, backups and all privacy choices in Norwegian, English, French, Spanish, German and Simplified Chinese.</p>
        <p class="noscript-note">Enable JavaScript to read the complete policy and select a language. This website contains no analytics or tracking script.</p>
      </section>
