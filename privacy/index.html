      <section lang="nb-NO" aria-labelledby="privacy-nb-title">
        <p class="eyebrow">Personvern · Norsk</p>
        <h1 id="privacy-nb-title">Personvern for Tind 100</h1>
        <p>Versjon 1.18 er under klargjøring og er ikke utgitt. Premium er ikke åpnet for salg. Apple håndterer eventuell betaling; appen kontrollerer kjøpsstatus og Premium-rettighet med StoreKit. Utgiveren mottar ikke kort- eller bankopplysninger gjennom kjøpsflyten. Lokal kjøpsstatus kan bevare en ventende forespørsel, men gir ikke i seg selv Premium-tilgang.</p>
        <p><strong>Sist oppdatert 15. oktober 2026.</strong> Gjelder Tind 100 versjon 1.18.0 (bygg 45).</p>
        <p>Tind 100 utgis av Lars Ask i Norge. Personvern- og sikkerhetshenvendelser kan sendes privat til <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Ikke send passord, engangskoder eller GPS-spor du ikke ønsker å dele.</p>
        <p>Tind 100 kan brukes uten innlogging eller egen Tind 100-konto. Fremdrift lagres først på iPhonen. Game Center-/iCloud-synk er avslått som standard og starter bare når du slår den på i Profil og nødvendig kontobekreftelse er fullført. Appen har ingen annonser, markedsføringssporing eller analyseverktøy og selger ikke personopplysninger.</p>
        <p>Game Center og iCloud er valgfrie. Slå på synkronisering i Profil og bekreft den aktuelle Game Center-spilleren og iCloud-kontoen før første synk. En aktiv v4-skykopi kan inneholde besøkte topp-ID-er og datoer, verifikasjonsmåte, poeng, rutesammendrag, utfordringer, fylke, toppmetadata, alias og nullstillingstidspunkt. Den inneholder ikke nøyaktig rutegeometri, rutestart, toppkoordinater eller innsjekkingsavstand.</p>
        <p>For å hindre at fremdrift blandes mellom kontoer, lagrer appen en enhetslokal binding av Game Center-spiller-ID og Apples ugjennomsiktige iCloud-kontoidentifikator i Nøkkelring. Dette er ikke et passord. Bindingen synkroniseres ikke til andre enheter, og appens av/på-valg eller nullstilling sletter den ikke.</p>
        <p>Kontobytte, utilgjengelig kontobinding eller eldre v1-/v3-skyfiler setter synkronisering på pause. Eldre filer importeres, overskrives eller slettes ikke automatisk; lokal bruk fortsetter. Apple behandler Game Center-, iCloud- og sikkerhetskopidata etter sine egne vilkår og personvernregler.</p>
        <p>Når du velger posisjonsfunksjoner, kan appen behandle nøyaktig eller omtrentlig posisjon for GPS-innsjekking, kart, fylkesoppslag og ruteregistrering. Aktive GPS-spor lagres lokalt. Apple Maps/MapKit sender nødvendige forespørsler for kart, geokoding og fylkesoppslag. Denne appversjonen sender ingen katalogforespørsler til Overpass API.</p>
        <p>Kartverkets turkart vises på nett til zoomnivå 17. Appen mellomlagrer automatisk kvalifiserte fliser som faktisk vises, på disk for zoomnivå 5–16 når kilden tillater det. Bufferen er begrenset til 128 MiB og 4 096 fliser, med levetid høyst sju dager og eventuelt kortere etter svaret fra kilden. Den er ikke et komplett offlinekart. Kartverket mottar flisekoordinater (x/y/z), som viser kartområdet, og vanlige nettverksopplysninger som IP-adresse. Det finnes ingen ny områdenedlasting fra Kartverket. Kartdata © Kartverket. Se kildenes vilkår og lisenser. Kartverket har ikke godkjent eller kvalitetssikret Tind 100.</p>
        <p>OSM-kartområder lastes bare ned etter at du velger og bekrefter ett område. Nedlastingen bruker HTTPS fra GitHub Releases og GitHubs filverter github.com, release-assets.githubusercontent.com eller objects.githubusercontent.com. Filverten mottar IP-adresse, valgt område gjennom filadressen og appens User-Agent; forespørselen sender ikke GPS-posisjon, rutespor eller Game Center-ID. Kartene bruker © OpenStreetMap-bidragsytere under ODbL 1.0. Pakkene har kildedata på zoomnivå 0–14 og kan vises til nivå 16; forstørring over 14 tilfører ikke flere detaljer.</p>
        <p>Den frivillige TestFlight-piloten er avslått som standard. Den lagrer bare en tilfeldig rapportkode, dagavrundede oppgave- og samtykkedatoer, appkontekst, faktisk vist lokalisert Premium-pris med valuta og kilde samt valgfrie Premium-svar lokalt; ingen koordinater, rutespor, toppnavn, søk, konto- eller enhetsidentifikatorer inngår. Ingenting sendes automatisk. Du ser hele JSON-rapporten og velger selv mottaker. Omstart av pilotfremdrift beholder den opplyste anonyme rapportkoden og revisjonen for å hindre dobbelttelling; full nullstilling av appen sletter også disse. Rapporter mottatt av utgiveren slettes eller anonymiseres innen 30 dager etter endelig pilotoppsummering og senest 90 dager etter mottak, med unntak for dokumenterte sikkerhets- eller rettskrav.</p>
        <p>Du kan trekke tilbake posisjonstilgang, slå Game Center-synk av eller på i Profil, tømme kartbufferen, slette nedlastede OSM-områder og nullstille lokal fremdrift. Avslått synk stopper nye synkforsøk uten å slette lokal fremdrift eller eksisterende skyfiler. Se Personvernvalg for fremgangsmåten.</p>
        <p>Lokal fremdrift beholdes til du nullstiller den eller sletter appen og kan inngå i enhetsbackup. Den begrensede kartbufferen kan utløpe eller tømmes i appen. OSM-områder blir liggende til du sletter dem i appen eller sletter appen. Kartbuffer og OSM-pakker er utelatt fra iOS-/iCloud-enhetsbackup og deles eller eksporteres ikke av appen.</p>
        <p>I Profil velger du «Nullstill nåværende fremdrift» og bekrefter. Lokal topp-, rute-, utfordrings- og pilotfremdrift nullstilles når lokal lagring lykkes. Nullstillingen kan oppdatere spillerens aktive v4-skyfremdrift gjennom senere gjennomført synk med gyldig kontobinding. Avslått eller blokkert synk starter ingen nye skyoppdateringer; en forespørsel som allerede er sendt, kan fullføres. Eldre v1-/v3-filer slettes eller overskrives ikke og blokkerer synk. Nullstilling sletter ikke Apple-kontoen, kontobindingen i Nøkkelring, enhetsbackup eller kartfilene.</p>
      </section>
      <hr>
      <section lang="en-GB" aria-labelledby="privacy-en-title">
        <p class="eyebrow">Privacy · English</p>
        <h2 id="privacy-en-title">Privacy policy for Tind 100</h2>
        <p>Version 1.18 is being prepared and has not been released. Premium is not on sale yet. Apple handles any payment; the app checks purchase status and Premium entitlement through StoreKit. The publisher does not receive card or bank details through the purchase flow. Local purchase status may preserve a pending request but cannot itself grant Premium access.</p>
        <p><strong>Last updated 15 October 2026.</strong> Applies to Tind 100 version 1.18.0 (build 45).</p>
        <p>Tind 100 is published by Lars Ask in Norway. Send privacy and security enquiries privately to <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Do not send passwords, one-time codes or GPS tracks you do not want to share.</p>
        <p>Tind 100 works without signing in or creating a Tind 100 account. Progress is saved on the iPhone first. Game Center/iCloud sync is off by default and starts only after you enable it in Profile and complete the required account confirmation. The app has no advertising, marketing tracking or analytics tools and does not sell personal data.</p>
        <p>Game Center and iCloud are optional. Enable sync in Profile and confirm the current Game Center player and iCloud account before the first sync. An active v4 cloud save may contain visited peak IDs and dates, verification method, points, route summaries, challenges, county, peak metadata, alias and reset timestamp. It does not contain precise route geometry, route start, peak coordinates or check-in distance.</p>
        <p>To prevent progress being mixed between accounts, the app stores a device-only binding of the Game Center player ID and Apple's opaque iCloud account identifier in Keychain. This is not a password. The binding does not sync to other devices and is not deleted by turning sync off or resetting progress in the app.</p>
        <p>Account changes, an unavailable account binding or older v1/v3 cloud files pause sync. Older files are not automatically imported, overwritten or deleted; local use remains available. Apple processes Game Center, iCloud and backup data under its own terms and privacy rules.</p>
        <p>When you choose location features, the app may process precise or approximate location for GPS check-in, maps, county lookup and route recording. Active GPS tracks are stored locally. Apple Maps/MapKit sends necessary requests for maps, geocoding and county lookup. This app version sends no catalogue requests to Overpass API.</p>
        <p>The online Kartverket hiking map is displayed up to zoom 17. The app automatically caches eligible tiles you actually view on disk at zoom levels 5–16 when the source permits it. The cache is limited to 128 MiB and 4,096 tiles, retained for at most seven days and possibly less depending on the source response. It is not a complete offline map. Kartverket receives tile coordinates (x/y/z), revealing the map area, and ordinary network information such as your IP address. No new Kartverket area download is offered. Map data © Kartverket. See the source terms and licences. Kartverket has not endorsed or quality-assured Tind 100.</p>
        <p>OSM map areas download only after you select and confirm one area. Downloads use HTTPS from GitHub Releases and GitHub file hosts github.com, release-assets.githubusercontent.com or objects.githubusercontent.com. The host receives your IP address, the selected area through the file URL and the app's User-Agent; the request does not send GPS position, route tracks or Game Center ID. Maps use © OpenStreetMap contributors under ODbL 1.0. Packages contain source data at zoom levels 0–14 and can be displayed up to level 16; enlarging above 14 adds no new detail.</p>
        <p>The voluntary TestFlight pilot is off by default. It stores only a random report code, day-rounded task and consent dates, app context, the localised Premium price actually displayed with currency and source, and optional Premium answers locally; no coordinates, route track, peak name, search, account or device identifier is included. Nothing is sent automatically. You review the full JSON report and choose the recipient. Restarting pilot progress retains the disclosed anonymous report code and revision to prevent duplicate counting; a full app reset also deletes those. Reports received by the publisher are deleted or anonymised within 30 days after the final pilot summary and no later than 90 days after receipt, except for documented security or legal requirements.</p>
        <p>You can withdraw location access, turn Game Center sync off or on in Profile, clear the map cache, delete downloaded OSM areas and reset local progress. Turning sync off stops new sync attempts without deleting local progress or existing cloud files. See Privacy choices for instructions.</p>
        <p>Local progress remains until you reset it or delete the app and may be included in device backups. The limited map cache may expire or be cleared in the app. OSM areas remain until you delete them in the app or delete the app. The map cache and OSM packages are excluded from iOS/iCloud device backups and are not shared or exported by the app.</p>
        <p>In Profile, choose Reset current progress and confirm. Local peak, route, challenge and pilot progress is reset when local saving succeeds. The reset can update the player's active v4 cloud progress through a later completed sync with a valid account binding. Disabled or blocked sync starts no new cloud updates; a request already sent may complete. Older v1/v3 files are not deleted or overwritten and block sync. Reset does not delete your Apple account, the Keychain account binding, device backups or map files.</p>
        <p class="noscript-note">Enable JavaScript to read the complete policy and select a language. This website contains no analytics or tracking script.</p>
