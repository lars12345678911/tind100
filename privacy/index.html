        <p class="eyebrow">Personvern · Norsk</p>
        <h1 id="privacy-nb-title">Personvern for Tind 100</h1>
        <p><strong>Sist oppdatert 29. august 2026.</strong> Gjelder Tind 100 versjon 1.17.0 (bygg 41) og nyere.</p>
        <p>Tind 100 utgis av Lars Ask i Norge. Personvern- og sikkerhetshenvendelser kan sendes privat til <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Ikke send passord, engangskoder eller GPS-spor du ikke ønsker å dele.</p>
        <p>Appen har ingen annonser, markedsføringssporing eller analyseverktøy og selger ikke personopplysninger. Fremdrift lagres først på iPhonen. Når enheten allerede er innlogget i Game Center, starter appen integrasjonen automatisk og kan synkronisere en begrenset fremdriftskopi gjennom Apples tjenester; appen har ingen egen Game Center-knapp for samtykke.</p>
        <p>Når du velger posisjonsfunksjoner, kan appen behandle nøyaktig eller omtrentlig posisjon for blant annet GPS-innsjekking, kart, fylkesoppslag og ruteregistrering. Aktive GPS-spor lagres lokalt. Apple Maps/MapKit, Kartverket og ved enkelte katalogoppdateringer Overpass API mottar nødvendige tjeneste- og nettverksforespørsler. Online toporaster er begrenset til zoomnivå 11 i bygg 41, og nye vedvarende offline-nedlastinger er deaktivert. Deling skjer først når du selv starter den; toppkoordinater og rutespor inngår ikke i delingslenken.</p>
        <p>Du kan trekke tilbake posisjonstilgang, logge ut av Game Center i iOS, slette eventuelle eldre lokale kartpakker og nullstille aktiv fremdrift. Det fullstendige dynamiske dokumentet inneholder lagringstider, rettslig grunnlag, mottakere, overføringer, sikkerhetskopier og alle personvernvalg på norsk, engelsk, spansk, tysk og forenklet kinesisk.</p>
      </section>
      <hr>
      <section lang="en-GB" aria-labelledby="privacy-en-title">
        <p class="eyebrow">Privacy · English</p>
        <h2 id="privacy-en-title">Privacy policy for Tind 100</h2>
        <p><strong>Last updated 29 August 2026.</strong> Applies to Tind 100 version 1.17.0 (build 41) and later.</p>
        <p>Tind 100 is published by Lars Ask in Norway. Send privacy and security enquiries privately to <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Do not send passwords, one-time codes or GPS tracks you do not want to share.</p>
        <p>The app has no advertising, marketing tracking or analytics tools and does not sell personal data. Progress is stored on the iPhone first. When the device is already signed in to Game Center, the app starts the integration automatically and may sync a limited progress copy through Apple’s services; there is no separate in-app Game Center consent switch.</p>
        <p>When you choose location features, the app may process precise or approximate location for features including GPS check-in, maps, county lookup and route recording. Active GPS tracks are stored locally. Apple Maps/MapKit, Kartverket and, for certain catalogue updates, Overpass API receive the service and network requests needed to provide those functions. Online topographic raster tiles are capped at zoom level 11 in build 41, and new persistent offline downloads are disabled. Sharing starts only when you initiate it; summit coordinates and route tracks are not included in the shared link.</p>
        <p>You can withdraw location access, sign out of Game Center in iOS, delete any retained legacy local map packages and reset active progress. The complete dynamic document covers retention, legal bases, recipients, transfers, backups and all privacy choices in Norwegian, English, Spanish, German and Simplified Chinese.</p>
        <p class="noscript-note">Enable JavaScript to read the complete policy and select a language. This website contains no analytics or tracking script.</p>
      </section>
