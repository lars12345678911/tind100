  <noscript><div class="noscript-card" lang="en-GB"><h1>Tind 100</h1><p>Tind 100 version 1.18.0 (build 45), updated 15 October 2026. This site needs JavaScript to show Norwegian, English, French, Spanish, German or Simplified Chinese. JavaScript is used only for local page rendering and language selection; no analytics or tracking is included.</p><section lang="nb-NO"><p>Nye toppbesøk krever GPS-innsjekking; manuell innsjekking er ikke mulig. Målt avstand til den registrerte toppen må være høyst 70 meter. Innsjekking kan fungere uten mobildekning når telefonen får en posisjon som er høyst 30 sekunder gammel og har oppgitt nøyaktighet på 70 meter eller bedre. Fremdrift lagres først på iPhonen. GPS-målinger kan være feil og er ikke et sikkert bevis på fysisk tilstedeværelse.</p></section>
<section lang="en-GB"><p>New peak visits require GPS check-in; manual check-in is not available. The measured distance from the recorded summit must be at most 70 metres. Check-in can work without mobile coverage when the phone obtains a position no more than 30 seconds old with reported accuracy of 70 metres or better. Progress is saved on the iPhone first. GPS measurements can be wrong and are not conclusive proof of physical presence.</p></section>
<section lang="fr-FR"><p>Les nouvelles visites de sommets nécessitent une validation GPS ; aucune validation manuelle n’est proposée. La distance mesurée au sommet enregistré doit être de 70 mètres au maximum. La validation peut fonctionner sans réseau mobile si le téléphone obtient une position datant de 30 secondes au plus, avec une précision annoncée de 70 mètres ou mieux. La progression est d’abord enregistrée sur l’iPhone. Les mesures GPS peuvent être erronées et ne prouvent pas avec certitude la présence physique.</p></section>
<section lang="es-ES"><p>Las nuevas visitas a cumbres requieren registro GPS; no hay registro manual. La distancia medida a la cumbre registrada debe ser de 70 metros como máximo. Puede funcionar sin cobertura móvil si el teléfono obtiene una posición de no más de 30 segundos de antigüedad con precisión indicada de 70 metros o mejor. El progreso se guarda primero en el iPhone. Las mediciones GPS pueden ser erróneas y no prueban de forma concluyente la presencia física.</p></section>
<section lang="de-DE"><p>Neue Gipfelbesuche erfordern einen GPS-Check-in; manuelle Check-ins sind nicht möglich. Die gemessene Entfernung zum verzeichneten Gipfel darf höchstens 70 Meter betragen. Ohne Mobilfunkempfang ist ein Check-in möglich, wenn das Telefon eine höchstens 30 Sekunden alte Position mit einer gemeldeten Genauigkeit von 70 Metern oder besser erhält. Fortschritt wird zuerst auf dem iPhone gespeichert. GPS-Messungen können falsch sein und sind kein sicherer Nachweis der tatsächlichen Anwesenheit.</p></section>
<section lang="zh-Hans-CN"><p>新的登顶记录必须通过 GPS 签到，不能手动签到。测得位置与已登记峰顶的距离必须不超过 70 米。即使没有移动网络，只要手机能获取不早于 30 秒前且报告精度为 70 米或更好的位置，也可能完成签到。进度先保存在 iPhone 上。GPS 测量可能有误，不能作为确实到达现场的可靠证明。</p></section></div></noscript>
