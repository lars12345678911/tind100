  <noscript><div class="noscript-card"><h1>Data sources for Tind 100</h1><p>Version 1.18.0 (build 44), updated 6 September 2026, uses an active source-and-licence-documented catalogue of 1,500 records: exactly 100 per county, derived from Kartverket SSR, DTM10, DTM1 and Kommuneinfo under CC BY 4.0. It contains no inherited hiking prose or prominence values. Kartverket topographic raster is shown as a separate online map capped at zoom level 11. With one explicit action, the user can download one selected area as one local package containing exactly zoom levels 5–11 and no others; zoom levels 12–20 are not downloaded. This documentation is not a legal guarantee. Enable JavaScript for complete attribution in six languages. This site contains no analytics or tracking script.</p></div></noscript>
