        <p class="eyebrow">Brukerstøtte · Norsk</p>
        <h1 id="support-nb-title">Brukerstøtte for Tind 100</h1>
        <p>Versjon 1.18 og Premium er under klargjøring, ikke i salg. Premium er et valgfritt engangskjøp uten abonnement; grunnleggende GPS, kart, offlinekart og sikkerhetsinformasjon forblir gratis. Etter ny installasjon kan kjøpet kontrolleres via Profil > Tind 100 Premium > Gjenopprett kjøp med samme Apple-konto. Du trenger nett. Se <a href="https://support.apple.com/108096">Apples hjelp med gjenoppretting</a> eller <a href="https://support.apple.com/118223">refusjon</a>.</p>
        <p><strong>Sist oppdatert 6. september 2026.</strong> Gjelder Tind 100 versjon 1.18.0 (bygg 44). For spørsmål som kan inneholde personopplysninger, kontoinformasjon, posisjon, GPS-spor eller sikkerhetsdetaljer, send e-post privat til <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Send aldri passord, Apple-ID-passord eller engangskoder.</p>
        <p>Vanlige feil uten personlige eller sensitive opplysninger kan rapporteres i <a href="https://github.com/lars12345678911/tind100/issues/new/choose">offentlige GitHub Issues</a>. Oppgi appversjon og byggnummer, iPhone-modell, iOS-versjon, valgt språk, fremgangsmåte, forventet resultat og faktisk resultat.</p>
        <p>Ved GPS-problemer bør du kontrollere stedstilgang i iOS og teste utendørs. Game Center-synk starter automatisk når enheten allerede er innlogget; kontroller konto og iCloud Drive ved problemer. Online toporaster er begrenset til zoomnivå 11. Velg Offlinekart i appen for å laste ned ett valgt område som én lokal pakke for nøyaktig zoomnivå 5–11; nivå 12–20 er ikke inkludert. Du kan slette én eller alle lokale pakker i samme visning.</p>
        <p>Tind 100 er ikke en overvåket nødtjeneste eller et navigasjons-, rednings- eller sikkerhetssystem. I Norge ringer du 112 for akutt nød- eller redningshjelp og 113 for akutt medisinsk hjelp.</p>
      </section>
      <hr>
      <section lang="en-GB" aria-labelledby="support-en-title">
        <p class="eyebrow">Support · English</p>
        <h2 id="support-en-title">Tind 100 support</h2>
        <p>Version 1.18 and Premium are being prepared, not on sale. Premium is an optional one-time purchase with no subscription; basic GPS, maps, offline maps and safety information remain free. After reinstalling, check the purchase in Profile > Tind 100 Premium > Restore Purchases using the same Apple Account. A connection is required. See Apple’s help with <a href="https://support.apple.com/108096">restoring purchases</a> or <a href="https://support.apple.com/118223">refunds</a>.</p>
        <p><strong>Last updated 6 September 2026.</strong> Applies to Tind 100 version 1.18.0 (build 44). For questions that may contain personal data, account information, location, GPS tracks or security details, email <a href="mailto:lars@larsask.com">lars@larsask.com</a> privately. Never send passwords, an Apple ID password or one-time codes.</p>
        <p>Ordinary bugs without personal or sensitive information can be reported through <a href="https://github.com/lars12345678911/tind100/issues/new/choose">public GitHub Issues</a>. Include the app version and build, iPhone model, iOS version, selected language, steps, expected result and actual result.</p>
        <p>For GPS problems, check the iOS location permission and test outdoors. Game Center sync starts automatically when the device is already signed in; check the account and iCloud Drive if needed. Online topographic raster tiles are capped at zoom level 11. In Offline Maps, download one selected area as one local package for exactly zoom levels 5–11; levels 12–20 are not included. You can delete one or all local packages in the same view.</p>
        <p>Tind 100 is not a monitored emergency service or a navigation, rescue or safety system. In Norway, call 112 for urgent emergency or rescue assistance and 113 for urgent medical help.</p>
        <p class="noscript-note">Enable JavaScript for complete support information in Norwegian, English, French, Spanish, German or Simplified Chinese. This website contains no analytics or tracking script.</p>
      </section>
