        <h1 id="support-nb-title">Brukerstøtte for Tind 100</h1>
        <p><strong>Sist oppdatert 29. august 2026.</strong> Gjelder Tind 100 versjon 1.17.0 (bygg 41). For spørsmål som kan inneholde personopplysninger, kontoinformasjon, posisjon, GPS-spor eller sikkerhetsdetaljer, send e-post privat til <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Send aldri passord, Apple-ID-passord eller engangskoder.</p>
        <p>Vanlige feil uten personlige eller sensitive opplysninger kan rapporteres i <a href="https://github.com/lars12345678911/tind100/issues/new/choose">offentlige GitHub Issues</a>. Oppgi appversjon og byggnummer, iPhone-modell, iOS-versjon, valgt språk, fremgangsmåte, forventet resultat og faktisk resultat.</p>
        <p>Ved GPS-problemer bør du kontrollere stedstilgang i iOS og teste utendørs. Game Center-synk starter automatisk når enheten allerede er innlogget; kontroller konto og iCloud Drive ved problemer. Nye offline-nedlastinger er deaktivert i bygg 41. Online toporaster er begrenset til zoomnivå 11, og eventuelle eldre lokale kartpakker kan fortsatt slettes i appen.</p>
        <p>Tind 100 er ikke en overvåket nødtjeneste eller et navigasjons-, rednings- eller sikkerhetssystem. I Norge ringer du 112 for akutt nød- eller redningshjelp og 113 for akutt medisinsk hjelp.</p>
      </section>
      <hr>
      <section lang="en-GB" aria-labelledby="support-en-title">
        <p class="eyebrow">Support · English</p>
        <h2 id="support-en-title">Tind 100 support</h2>
        <p><strong>Last updated 29 August 2026.</strong> Applies to Tind 100 version 1.17.0 (build 41). For questions that may contain personal data, account information, location, GPS tracks or security details, email <a href="mailto:lars@larsask.com">lars@larsask.com</a> privately. Never send passwords, an Apple ID password or one-time codes.</p>
        <p>Ordinary bugs without personal or sensitive information can be reported through <a href="https://github.com/lars12345678911/tind100/issues/new/choose">public GitHub Issues</a>. Include the app version and build, iPhone model, iOS version, selected language, steps, expected result and actual result.</p>
        <p>For GPS problems, check the iOS location permission and test outdoors. Game Center sync starts automatically when the device is already signed in; check the account and iCloud Drive if needed. New offline downloads are disabled in build 41. Online topographic raster tiles are capped at zoom level 11, and any retained legacy local map packages can still be deleted in the app.</p>
        <p>Tind 100 is not a monitored emergency service or a navigation, rescue or safety system. In Norway, call 112 for urgent emergency or rescue assistance and 113 for urgent medical help.</p>
        <p class="noscript-note">Enable JavaScript for complete support information in Norwegian, English, Spanish, German or Simplified Chinese. This website contains no analytics or tracking script.</p>
      </section>
