      <section lang="nb-NO" aria-labelledby="support-nb-title">
        <p class="eyebrow">Brukerstøtte · Norsk</p>
        <h1 id="support-nb-title">Brukerstøtte for Tind 100</h1>
        <p>Versjon 1.18 og Premium er under klargjøring, ikke i salg. Premium er et valgfritt engangskjøp uten abonnement; grunnleggende GPS, kart, offlinekart og sikkerhetsinformasjon forblir gratis. Etter ny installasjon kan kjøpet kontrolleres via Profil > Tind 100 Premium > Gjenopprett kjøp med samme Apple-konto. Du trenger nett. Se <a href="https://support.apple.com/108096">Apples hjelp med gjenoppretting</a> eller <a href="https://support.apple.com/118223">refusjon</a>.</p>
        <p><strong>Sist oppdatert 15. oktober 2026.</strong> Gjelder Tind 100 versjon 1.18.0 (bygg 45). For spørsmål som kan inneholde personopplysninger, kontoinformasjon, posisjon, GPS-spor eller sikkerhetsdetaljer, send e-post privat til <a href="mailto:lars@larsask.com">lars@larsask.com</a>. Send aldri passord, Apple-ID-passord eller engangskoder.</p>
        <p>Vanlige feil uten personlige eller sensitive opplysninger kan rapporteres i <a href="https://github.com/lars12345678911/tind100/issues/new/choose">offentlige GitHub Issues</a>. Oppgi appversjon og byggnummer, iPhone-modell, iOS-versjon, valgt språk, fremgangsmåte, forventet resultat og faktisk resultat.</p>
        <p>Ved GPS-problemer bør du kontrollere stedstilgang i iOS og teste utendørs.</p>
        <p>Game Center: synk er valgfri og avslått som standard. Slå den på i Profil og fullfør kontobekreftelsen hvis du ønsker skysynk. Kontroller samme Game Center-/iCloud-konto og tilgang til iCloud Drive ved problemer. En kontobytte- eller eldre-data-advarsel betyr at synk er satt på pause; lokal fremdrift beholdes.</p>
        <p>Offlinekart: åpne Profil → Kartlagring → nedlastbare OSM-kartområder, velg og bekreft området du trenger. Hold appen åpen under nedlasting. Kontroller det ferdige kartet uten nett før turen. Kartbufferen inneholder bare nylig viste, kvalifiserte Kartverket-fliser og erstatter ikke et nedlastet område.</p>
        <p>Åpne Profil → Kartlagring for å tømme kartbufferen. Åpne listen over nedlastbare OSM-kartområder for å slette ett lagret område og bekrefte slettingen. Dette sletter ikke turhistorikken. Området må lastes ned på nytt mens det fortsatt er tilgjengelig for å brukes uten nett. Sletting av appen fjerner også de lokale kartfilene.</p>
        <p>Tind 100 er ikke en overvåket nødtjeneste eller et navigasjons-, rednings- eller sikkerhetssystem. I Norge ringer du 112 for akutt nød- eller redningshjelp og 113 for akutt medisinsk hjelp.</p>
      </section>
      <hr>
      <section lang="en-GB" aria-labelledby="support-en-title">
        <p class="eyebrow">Support · English</p>
        <h2 id="support-en-title">Tind 100 support</h2>
        <p>Version 1.18 and Premium are being prepared, not on sale. Premium is an optional one-time purchase with no subscription; basic GPS, maps, offline maps and safety information remain free. After reinstalling, check the purchase in Profile > Tind 100 Premium > Restore purchase using the same Apple Account. A connection is required. See Apple’s help with <a href="https://support.apple.com/108096">restoring purchases</a> or <a href="https://support.apple.com/118223">refunds</a>.</p>
        <p><strong>Last updated 15 October 2026.</strong> Applies to Tind 100 version 1.18.0 (build 45). For questions that may contain personal data, account information, location, GPS tracks or security details, email <a href="mailto:lars@larsask.com">lars@larsask.com</a> privately. Never send passwords, an Apple ID password or one-time codes.</p>
        <p>Ordinary bugs without personal or sensitive information can be reported through <a href="https://github.com/lars12345678911/tind100/issues/new/choose">public GitHub Issues</a>. Include the app version and build, iPhone model, iOS version, selected language, steps, expected result and actual result.</p>
        <p>For GPS problems, check iOS location permission and test outdoors.</p>
        <p>Game Center: sync is optional and off by default. Enable it in Profile and complete account confirmation if you want cloud sync. Check the same Game Center/iCloud accounts and iCloud Drive access if problems occur. An account-change or older-data warning means sync is paused; local progress is kept.</p>
        <p>Offline maps: open Profile → Map storage → downloadable OSM map areas, then select and confirm the area you need. Keep the app open during download. Check the installed map without a connection before your hike. The map cache contains only recently viewed eligible Kartverket tiles and does not replace a downloaded area.</p>
        <p>Open Profile → Map storage to clear the map cache. Open the downloadable OSM map areas list to delete an installed area and confirm its removal. This does not delete your hike history. To use the area offline again, download it again while it remains available. Deleting the app also removes its local map files.</p>
        <p>Tind 100 is not a monitored emergency service or a navigation, rescue or safety system. In Norway, call 112 for urgent emergency or rescue assistance and 113 for urgent medical help.</p>
        <p class="noscript-note">Enable JavaScript for complete support information in Norwegian, English, French, Spanish, German or Simplified Chinese. This website contains no analytics or tracking script.</p>
      </section>
