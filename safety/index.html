  <noscript><div class="noscript-card" lang="en-GB"><h1>Safety for Tind 100</h1><p>Applies to version 1.18.0 (build 45), updated 15 October 2026.</p>
        <p>GPS, online maps, the map cache and downloaded OSM maps may be inaccurate, incomplete, outdated or unavailable. The cache is not a complete offline map. An OSM area covers only its stated area and may lack paths or other data. Display above source zoom 14 enlarges existing data without adding detail. Check the map without a connection before your hike and carry a suitable alternative and emergency equipment. The phone, battery, storage, network and satellite reception can fail.</p>
