      <h1>Third-party notices for Tind 100</h1>
      <p>Applies to version 1.18.0 (build 45), updated 15 October 2026. Tind 100 uses Apple services, attributed Kartverket open data under CC BY 4.0, and Statistics Norway (SSB) population-grid data for 2025 under NLOD 1.0.</p>
      <p>The online Kartverket hiking map is displayed up to zoom 17. The app automatically caches eligible tiles you actually view on disk at zoom levels 5–16 when the source permits it. The cache is limited to 128 MiB and 4,096 tiles, retained for at most seven days and possibly less depending on the source response. It is not a complete offline map. Kartverket receives tile coordinates (x/y/z), revealing the map area, and ordinary network information such as your IP address. No new Kartverket area download is offered. Map data © Kartverket. See the source terms and licences. Kartverket has not endorsed or quality-assured Tind 100.</p>
        <p>OSM map areas download only after you select and confirm one area. Downloads use HTTPS from GitHub Releases and GitHub file hosts github.com, release-assets.githubusercontent.com or objects.githubusercontent.com. The host receives your IP address, the selected area through the file URL and the app's User-Agent; the request does not send GPS position, route tracks or Game Center ID. Maps use © OpenStreetMap contributors under ODbL 1.0. Packages contain source data at zoom levels 0–14 and can be displayed up to level 16; enlarging above 14 adds no new detail.</p>
        <p>Map-source terms and data licences are separate from the peak catalogue licence. See the applicable attribution and linked terms. This is not an endorsement or a general permission to redistribute Kartverket tiles.</p>
      <p>Tind 100 uses Apple Maps/MapKit for maps, geocoding and county lookup. Game Center/iCloud is used for progress only when you choose sync and account confirmation permits it. Apple processes the necessary account, service, network and backup data under its own terms and privacy rules.</p>
        <p>The app sends no catalogue requests to Overpass; the legacy importer remains only as developer source and is not included in ordinary app builds. The app uses GitHub-hosted OSM area downloads and user-selected external services; this website is hosted on GitHub Pages. This documentation is not a legal guarantee. Enable JavaScript for complete notices and licence links in six languages. This site contains no analytics or tracking script.</p>
